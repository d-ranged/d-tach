<!DOCTYPE html>
<html lang="en" data-theme="T4">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d-tach — {% block title %}{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script>(function(){var t=localStorage.getItem('d-tach-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <button id="logo-btn" class="logo-btn" aria-label="Toggle theme">
                <img src="{{ url_for('static', filename='d-logo.png') }}" alt="d-ranged" class="logo-img">
            </button>
            <span class="app-name">d-tach</span>
            <nav class="mode-nav">
                <a href="{{ url_for('text.text_mode') }}"
                   class="nav-link {% if active_mode == 'text' %}active{% endif %}">
                    Text Mode
                </a>
                <a href="{{ url_for('document.document_mode') }}"
                   class="nav-link {% if active_mode == 'document' %}active{% endif %}">
                    Document Mode
                </a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <p class="disclaimer">
            &#9888; Pattern matching may produce false positives.
            Review the key reference file before sharing anonymized output.
        </p>
        <p class="version">v{{ app_version }}</p>
    </footer>

    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
