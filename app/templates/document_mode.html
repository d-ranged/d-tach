{% extends "base.html" %}

{% block title %}Document Mode{% endblock %}

{% block content %}
<section class="settings-bar">
    <div class="setting-group">
        <div class="lang-selector" id="lang-selector">
            <button class="lang-btn {% if language == 'en' %}active{% endif %}" data-lang="en">EN</button>
            <button class="lang-btn {% if language == 'nl' %}active{% endif %}" data-lang="nl">NL</button>
        </div>
    </div>

    <div class="setting-group">
        <label class="toggle">
            <input type="checkbox" id="dates-toggle" {% if anonymize_dates %}checked{% endif %}>
            <span class="toggle-track"></span>
            <span class="setting-label">Anonymize dates</span>
        </label>
    </div>

    <div class="setting-group">
        <label class="toggle">
            <input type="checkbox" id="numeric-id-toggle" {% if pattern_config.numeric_id_enabled %}checked{% endif %}>
            <span class="toggle-track"></span>
            <span class="setting-label">Numeric ID</span>
        </label>
        <input
            type="number"
            id="digit-count"
            class="digit-input"
            value="{{ pattern_config.digit_count }}"
            min="4"
            max="12"
            title="Exact digit count to detect"
        >
    </div>

    <div class="setting-group">
        <label class="toggle">
            <input type="checkbox" id="names-toggle">
            <span class="toggle-track"></span>
            <span class="setting-label">Check file/folder names</span>
        </label>
    </div>

    <div class="setting-group">
        <label class="toggle">
            <input
                type="checkbox"
                id="hashing-toggle"
                {% if hashing_enabled %}checked{% endif %}
            >
            <span class="toggle-track"></span>
            <span class="setting-label">Enable hashing</span>
        </label>
        <div class="secret-field" id="secret-field" {% if not hashing_enabled %}hidden{% endif %}>
            <label for="secret-input" class="secret-label">Secret</label>
            <input
                type="password"
                id="secret-input"
                class="secret-input"
                placeholder="Enter a secret phrase"
                value="{{ hashing_secret }}"
                autocomplete="off"
            >
        </div>
    </div>

    <div class="setting-group">
        <label class="toggle">
            <input type="checkbox" id="keyref-toggle">
            <span class="toggle-track"></span>
            <span class="setting-label">Key reference</span>
        </label>
    </div>
</section>

<section class="doc-section">
    <h2 class="section-heading">Input</h2>

    <div class="input-mode-tabs">
        <button class="input-tab active" id="tab-file" data-tab="file">Single File</button>
        <button class="input-tab" id="tab-folder" data-tab="folder">Folder</button>
    </div>

    <div id="panel-file" class="input-panel">
        <div class="folder-input-row">
            <input
                type="text"
                class="folder-path-display"
                id="file-path"
                placeholder="Paste or browse to a DOCX or PDF file"
            >
            <button class="btn btn-secondary" id="browse-file-btn">Browse&hellip;</button>
            <button class="btn btn-primary" id="process-file-btn">Process File</button>
        </div>
    </div>

    <div id="panel-folder" class="input-panel" hidden>
        <div class="folder-input-row">
            <input
                type="text"
                class="folder-path-display"
                id="folder-path"
                placeholder="Paste or browse to a folder"
            >
            <button class="btn btn-secondary" id="browse-folder-btn">Browse&hellip;</button>
            <button class="btn btn-primary" id="process-folder-btn">Process Folder</button>
            <button class="btn btn-secondary" id="cancel-btn" hidden>Cancel</button>
        </div>
    </div>
</section>

<section class="doc-section" id="progress-section">
    <h2 class="section-heading">Progress</h2>
    <div class="progress-area" id="progress-area">
        <span class="muted">No processing in progress.</span>
    </div>
    <div class="progress-bar-wrap" id="progress-bar-wrap" hidden>
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="progress-log" id="progress-log" hidden></div>
</section>

<section class="doc-section" id="summary-section">
    <h2 class="section-heading">Results</h2>
    <div class="summary-area" id="summary-area">
        <span class="muted">Results will appear here after processing.</span>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>const INITIAL_LANGUAGE = "{{ language }}";</script>
<script src="{{ url_for('static', filename='js/document_mode.js') }}"></script>
{% endblock %}
